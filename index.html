<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Sito</title><meta name="description" content=""><link rel="icon" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<script src="data.js"></script>
<style>
/* LAYOUT "trattoria": carta crema, foto ad arco, menù stampato su foglio. Trattorie, osterie di famiglia, cucina tipica. */
:root{--primary:#2f4a32;--primary-2:#1f3322;--accent:#a8542a;--accent-2:#e9c46a;--soft:#efe8d6;--cream:#f3ead6;--paper:#faf5ea;--ink:#2b2620;--muted:#6b6254;--line:#dccfb3;--max:1120px}
body{font-family:Lato,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;font-weight:700;line-height:1.12}
em{font-style:italic;font-weight:500}
.eyebrow{font-family:"Playfair Display",serif;font-style:italic;font-size:1.05rem;color:var(--accent)}
.btn{padding:.85em 1.5em;border-radius:6px;font-size:.95rem;letter-spacing:.02em}
.btn-primary{background:var(--accent);color:#fff}.btn-secondary{border:1.5px solid var(--primary);color:var(--primary)}
.orn{display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--accent);margin:.4rem 0 .6rem}
.orn::before,.orn::after{content:"";width:48px;height:1px;background:currentColor;opacity:.6}
header{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand img{width:48px;height:48px;object-fit:contain}
.brand b{font-family:"Playfair Display",serif;font-size:1.3rem;display:block;color:var(--primary)}
.brand small{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
nav{display:flex;gap:1.6rem;align-items:center;font-weight:700;font-size:.9rem;color:var(--primary)}
nav a{text-decoration:none}nav a:not(.btn):hover{color:var(--accent)}
nav .btn{padding:.55em 1em}
@media (max-width:860px){nav a:not(.btn){display:none}}
.hero{padding:clamp(40px,6vw,80px) 0}
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(2.5rem,5.6vw,4.6rem);color:var(--primary);margin:.3em 0 .35em}
.hero h1 em{color:var(--accent)}
.hero p{font-size:1.12rem;color:var(--muted);max-width:44ch}
.cta{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.8rem}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:2rem}
.badges span{border:1px solid var(--line);background:var(--cream);padding:.35em .9em;border-radius:999px;font-size:.85rem;font-weight:700;color:var(--primary)}.badges i{display:none}
.arch{position:relative}
.arch img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 14px 14px;border:8px solid #fff;box-shadow:0 20px 50px rgba(60,40,10,.18)}
.arch .stamp{position:absolute;left:-24px;bottom:30px;width:110px;height:110px;border-radius:0;border:0;box-shadow:none;aspect-ratio:auto;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.2))}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.arch{max-width:420px;margin:0 auto}.arch .stamp{left:0}}
section{padding:clamp(60px,9vw,110px) 0}
.center{text-align:center;max-width:680px;margin:0 auto 2.6rem}
.center h2{font-size:clamp(2rem,4vw,3rem);color:var(--primary)}
.center p{color:var(--muted);font-size:1.05rem}
.pillars{display:grid;grid-template-columns:repeat(var(--n,4),1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.p-item{padding:2rem 1.4rem;text-align:center}.p-item+.p-item{border-left:1px solid var(--line)}
.p-n{font-family:"Playfair Display",serif;font-style:italic;color:var(--accent);font-size:1.4rem}
.p-item h3{font-size:1.2rem;color:var(--primary);margin:.4rem 0}.p-item p{color:var(--muted);font-size:.93rem}
@media (max-width:860px){.pillars{grid-template-columns:1fr 1fr}.p-item:nth-child(3){border-left:0}.p-item:nth-child(n+3){border-top:1px solid var(--line)}}
@media (max-width:480px){.pillars{grid-template-columns:1fr}.p-item+.p-item{border-left:0;border-top:1px solid var(--line)}}
#storia{background:var(--cream)}
.story{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(30px,6vw,80px);align-items:center}
.framed{position:relative;padding:0 18px 18px 0}.framed::before{content:"";position:absolute;inset:18px 0 0 18px;border:2px solid var(--accent);border-radius:8px}
.framed img{position:relative;border-radius:8px;aspect-ratio:1;object-fit:cover;width:100%}
.story h2{font-size:clamp(1.9rem,3.6vw,2.8rem);color:var(--primary);margin:.3em 0 .6em}
.story p{color:var(--muted);margin-bottom:1em}
.story ul{display:grid;gap:.5rem;margin-top:1rem}.story li::before{content:"❧ ";color:var(--accent)}
@media (max-width:820px){.story{grid-template-columns:1fr}}
.gallery{display:flex;justify-content:center;flex-wrap:wrap;gap:22px;padding:10px}
.g-item{background:#fff;padding:10px 10px 14px;box-shadow:0 10px 30px rgba(60,40,10,.15);width:min(260px,44vw);transform:rotate(-2deg);transition:transform .3s}
.g-item:nth-child(even){transform:rotate(2.2deg) translateY(12px)}.g-item:hover{transform:rotate(0) scale(1.03)}
.g-item img{aspect-ratio:1;object-fit:cover;width:100%}
.g-item figcaption{font-family:"Playfair Display",serif;font-style:italic;text-align:center;font-size:.9rem;margin-top:.5rem;color:var(--muted)}
.menu-bar{position:sticky;top:72px;z-index:10;background:var(--paper);padding:.7rem 0;border-bottom:1px solid var(--line);margin-bottom:2rem}
.menu-tabs{justify-content:center}
.menu-tabs button{background:none;border:0;font-weight:700;font-size:.92rem;color:var(--muted);padding:.3em .6em;border-bottom:2px solid transparent}
.menu-tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.menu-pick{padding:.65em 1em;border:1.5px solid var(--primary);border-radius:6px;background:#fff;color:var(--primary);font-weight:700}
.menu-search{border-radius:6px;color:var(--primary)}.menu-search input{background:#fff;border-color:var(--line)}
@media (min-width:761px){.menu-ctl{justify-content:center;flex-direction:column}}
.sheet{max-width:820px;margin:0 auto;background:#fff;padding:clamp(28px,5vw,60px);border:1px solid var(--line);outline:1px solid var(--line);outline-offset:-10px;box-shadow:0 20px 50px rgba(60,40,10,.08)}
.m-cat{margin-bottom:2.8rem}
.m-cat-h{text-align:center;margin-bottom:1.2rem}
.m-cat-h h3{font-size:1.8rem;color:var(--primary)}
.m-cat-h h3::after{content:"✦";display:block;font-size:.8rem;color:var(--accent);margin-top:.3rem}
.m-cat-h small{color:var(--muted);font-style:italic}
.m-item{padding:.55rem 0}
.m-name{font-family:"Playfair Display",serif;font-weight:700;font-size:1.05rem}
.m-dots{border-bottom:1px dotted var(--line);transform:translateY(-5px)}
.m-price{color:var(--accent)}.m-desc{font-style:italic}
.m-tag{background:var(--accent-2);color:var(--primary)}
.notes{max-width:820px;margin:1.4rem auto 0;display:grid;gap:.4rem;font-size:.88rem;color:var(--muted);text-align:center}
.notes a{color:var(--accent);font-weight:700}
#dove{background:var(--primary);color:#f3ead6}
#dove .center h2{color:#fff}#dove .center p{color:rgba(255,255,255,.7)}#dove .eyebrow{color:var(--accent-2)}
.info{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:18px}
.card{background:var(--paper);color:var(--ink);border-radius:10px;padding:1.6rem}
.card h3{color:var(--primary);font-size:1.3rem;margin:.4rem 0 .8rem}.card p{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}.actions .btn{padding:.6em 1em;font-size:.85rem}
.map{border-radius:10px;overflow:hidden;min-height:380px}
@media (max-width:960px){.info{grid-template-columns:1fr 1fr}.map{grid-column:1/-1}}@media (max-width:620px){.info{grid-template-columns:1fr}}
footer{background:var(--primary-2);color:rgba(255,255,255,.7);padding:48px 0;text-align:center;font-size:.9rem}
footer .brand{justify-content:center;color:#fff}footer .brand b{color:#fff}footer .brand small{color:rgba(255,255,255,.6)}
footer .social{justify-content:center;margin:1rem 0}footer .social a{border:1px solid rgba(255,255,255,.25)}
.legal{font-size:.78rem;opacity:.6;margin-top:1rem}
.callbar .btn-secondary{background:var(--primary);color:#fff;border:0}
</style>
</head>
<body>
<header data-sticky><div class="wrap top">
  <a class="brand" href="#top"><img data-s="logo" alt=""><span><b data-s="shortName"></b><small data-s="tagline"></small></span></a>
  <nav data-s="nav"></nav>
</div></header>
<section class="hero" id="top"><div class="wrap">
  <div class="reveal"><span class="eyebrow" data-s="hero-eyebrow"></span><h1 data-s="hero-title"></h1><p data-s="hero-lead"></p><div class="cta" data-s="hero-cta"></div><div class="badges" data-s="hero-badges"></div></div>
  <div class="arch reveal"><img data-s="hero-img" fetchpriority="high"><img class="stamp" data-s="story-stamp" alt=""></div>
</div></section>
<section data-section="pillars" style="padding-top:0"><div class="wrap"><div class="pillars reveal" data-s="pillars"></div></div></section>
<section id="storia" data-section="story"><div class="wrap story">
  <div class="framed reveal"><img data-s="story-img" loading="lazy"></div>
  <div class="reveal"><span class="eyebrow" data-s="story-eyebrow"></span><h2 data-s="story-title"></h2><div data-s="story-body"></div><ul data-s="story-bullets"></ul></div>
</div></section>
<section id="galleria" data-section="gallery"><div class="wrap">
  <div class="center reveal"><span class="eyebrow" data-s="gallery-eyebrow"></span><h2 data-s="gallery-title"></h2><div class="orn">✦</div><p data-s="gallery-lead"></p></div>
  <div class="gallery reveal" data-s="gallery" data-max="5" data-captions="yes"></div>
</div></section>
<section id="menu" data-section="menu" style="padding-top:0">
  <div class="wrap"><div class="center reveal"><span class="eyebrow" data-s="menu-eyebrow"></span><h2 data-s="menu-title"></h2><div class="orn">✦</div><p data-s="menu-lead"></p></div></div>
  <div class="menu-bar" data-sticky><div class="wrap menu-ctl"><div class="menu-tabs" role="tablist" data-s="menu-tabs"></div><select class="menu-pick" data-s="menu-pick" aria-label="Categoria"></select><label class="menu-search" data-s="menu-search"></label></div></div>
  <div class="wrap"><div class="sheet"><div data-s="menu-list" data-style="list"></div><p data-s="menu-empty">Nessun piatto trovato.</p></div><div class="notes" data-s="menu-notes"></div></div>
</section>
<section id="dove"><div class="wrap">
  <div class="center reveal"><span class="eyebrow">Vi aspettiamo</span><h2 data-s="addressShort"></h2><p data-s="addressLead"></p></div>
  <div class="info">
    <div class="card reveal" data-section="hours"><span class="status" data-s="status"></span><h3>Orari</h3><table class="hours" data-s="hours"></table><p data-s="hours-note"></p></div>
    <div class="card reveal"><h3>Contatti</h3><p data-s="contacts"></p><div class="actions" data-s="contact-actions"></div></div>
    <div class="map reveal"><iframe data-s="map"></iframe></div>
  </div>
</div></section>
<footer><div class="wrap">
  <a class="brand" href="#top"><img data-s="logo" alt=""><span><b data-s="name"></b><small data-s="since"></small></span></a>
  <div class="social" data-s="social"></div><p data-s="footer-contacts"></p><p class="legal" data-s="legal"></p>
</div></footer>
<div class="callbar" data-s="callbar"></div>
<script src="core.js"></script>
</body>
</html>
